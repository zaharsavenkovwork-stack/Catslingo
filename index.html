<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catslingo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ee;--card:#fff;--text:#2d2a32;--muted:#8a8392;--acc:#ff8a3d;--acc2:#e9702a;--good:#3fbf72;--goodbg:#e3f7ea;--bad:#ef5b5b;--badbg:#fde8e8;--line:#f0e3d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a22;--card:#2a2630;--text:#f4eee8;--muted:#a49cac;--line:#3a3442;--goodbg:#1f3a2a;--badbg:#412426;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a22;--card:#2a2630;--text:#f4eee8;--muted:#a49cac;--line:#3a3442;--goodbg:#1f3a2a;--badbg:#412426;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:900;font-size:20px;letter-spacing:.2px}
.pills{display:flex;gap:8px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:900;font-size:15px}
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px;margin-bottom:18px}
.hero svg{width:96px;height:96px;flex:none}
.bubble{position:relative;background:var(--bg);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.35}
h2{font-size:16px;margin:4px 4px 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:900}
.path{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.node{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.node:active{transform:translateY(2px);border-bottom-width:3px}
.node .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:26px;flex:none}
.node b{display:block;font-size:17px;font-weight:900}
.node small{color:var(--muted);font-size:13px}
.node.cur{border-color:var(--acc)}
.node.cur .ic{background:var(--acc)}
.node.done .ic{background:var(--goodbg)}
.node.lock{opacity:.5;cursor:default}
.tag{margin-left:auto;font-size:20px}
.lh{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;padding:0 4px;font-family:inherit}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width .4s}
.q{flex:1;display:flex;flex-direction:column}
.q h3{font-size:22px;margin:0 0 6px;font-weight:900}
.word{font-size:34px;font-weight:900;text-align:center;margin:18px 0 22px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px;font:inherit;font-size:18px;font-weight:800;color:inherit;cursor:pointer;text-align:center}
.opt:active{transform:translateY(2px)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:8px 0}
.ans{border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin:14px 0;min-height:70px;align-content:flex-start}
.chip{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 14px;font:inherit;font-size:17px;font-weight:800;color:inherit;cursor:pointer}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--acc);box-shadow:0 5px 0 var(--acc2);cursor:pointer;margin-top:auto}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--acc2)}
.btn:disabled{background:var(--line);box-shadow:0 5px 0 var(--line);color:var(--muted);cursor:default}
.fb{margin:14px -16px -16px;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.fb.ok{background:var(--goodbg)}.fb.no{background:var(--badbg)}
.fbr{display:flex;align-items:center;gap:10px}
.fbr svg{width:64px;height:64px;flex:none}
.fbr p{margin:0;font-size:16px;line-height:1.35}
.fb.ok .btn{background:var(--good);box-shadow:0 5px 0 #2f9a5a}
.fb.no .btn{background:var(--bad);box-shadow:0 5px 0 #c94646}
.res{text-align:center;display:flex;flex-direction:column;flex:1;align-items:center}
.res svg{width:170px;height:170px;margin-top:20px}
.res h1{font-size:28px;margin:10px 0 4px;font-weight:900}
.stats{display:flex;gap:12px;margin:18px 0 24px;width:100%}
.stat{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-size:26px;font-weight:900}
.stat small{color:var(--muted);font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;text-align:center;margin:10px 0 18px}
.cat{object-fit:contain;flex:none;display:block}
.hero .cat{width:96px;height:96px}.fbr .cat{width:84px;height:84px}.res .cat{width:170px;height:170px;margin-top:20px}
.hero3{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px 14px 0;margin-bottom:14px;overflow:hidden}
.bubble3{background:var(--bg);border-radius:18px;padding:10px 16px;font-size:15px;line-height:1.35;align-self:stretch;text-align:center}
.bubble3 b{font-size:22px;font-weight:900;margin-right:6px}
.trio{display:flex;align-items:flex-end;justify-content:center;gap:8px;flex:none}
.trio .cat-r{height:122px;width:auto}.trio .cat-p{height:108px;width:auto}.trio .cat-m{height:68px;width:auto}
.trio svg{height:100px;width:auto}
.cont{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px}
.cont .row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.cont .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:26px;flex:none}
.cont small{display:block;color:var(--muted);font-size:13px}.cont b{display:block;font-size:18px;font-weight:900;line-height:1.2}
.ub{position:relative;overflow:hidden;border-radius:22px;padding:16px;color:#fff;display:flex;align-items:center;gap:14px;cursor:pointer;min-height:96px;margin-top:14px;list-style:none;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.ub::-webkit-details-marker{display:none}
.ub img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ub.hasimg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.05))}
.ub>*{position:relative;z-index:2}
.em2{font-size:40px;line-height:1;flex:none}
.uimg{width:84px;height:84px;flex:none;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.22);display:grid;place-items:center;border:3px solid rgba(255,255,255,.85)}
.ubt{flex:1;min-width:0}.ubt b{font-size:18px;font-weight:900;display:block;line-height:1.2}.ubt small{display:block;font-size:13px;opacity:.95;margin-top:2px;line-height:1.3}
.ubp{height:6px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:8px;overflow:hidden}.ubp i{display:block;height:100%;background:#fff;border-radius:9px}
.ubn{font-weight:900;font-size:15px;flex:none}
.nav{position:sticky;bottom:0;margin:auto -16px -16px;padding:8px 12px;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around}
.nav button{background:none;border:0;font:inherit;font-weight:900;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:12px;padding:6px 10px}
.nav button.on{color:var(--acc2)}.nav span{font-size:22px}
.meR{border-color:var(--acc)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.mc{display:grid;gap:10px;align-content:start}.mb{padding:14px 8px;font-size:16px}.mb.sel{border-color:var(--acc);background:var(--bg)}
.em{font-size:72px;line-height:1.1}
.en{font-size:38px;font-weight:900;margin:6px 0}
.ru{font-size:22px;color:var(--acc2);margin:12px 0;font-weight:900}
.say{background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:8px 16px;font:inherit;font-weight:800;color:inherit;cursor:pointer}
.exs{margin-top:10px;padding-top:12px;border-top:2px dashed var(--line);font-size:16px;line-height:1.5;color:var(--muted)}
.exs b{color:var(--text)}
.inp{width:100%;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px;font:inherit;font-size:22px;font-weight:800;text-align:center;background:var(--card);color:var(--text);outline:none}
.inp:focus{border-color:var(--acc)}
.wr{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.wr b{font-size:17px;display:block}.wr small{color:var(--muted);font-size:14px}
.we{font-size:28px}.wr .x{margin-left:auto}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>

<script>
function cat(k,mood){
 mood=mood||'happy';
 const m=['happy','sad','think','party'].includes(mood)?mood:'happy',key=k+'_'+m;
 const src=(window.CATIMG&&CATIMG[key])||'img/cats/'+key+'.webp';
 return `<img class="cat cat-${k}" src="${src}" alt="" onerror='this.outerHTML=catSvg("${k}","${mood}")'>`;
}
const CATS={
 r:{b:'#F28C38',hr:28,bw:30,bh:24},
 p:{b:'#34343c',hr:30,bw:46,bh:28},
 m:{b:'#34343c',hr:25,bw:20,bh:15}
};
function catSvg(k,mood){
 mood=mood||'happy';
 const c=CATS[k],hr=c.hr,hy=100-c.bh-hr*0.9,by=hy+hr*0.9,ey=hy-hr*0.05,ex=hr*0.4;
 const dk='#2a2230';
 let eyes;
 if(mood==='happy'){
  eyes=[-1,1].map(s=>`<path d="M${60+s*ex-5} ${ey+2} q5 -8 10 0" stroke="${dk}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`).join('');
 }else{
  eyes=[-1,1].map(s=>`<circle cx="${60+s*ex}" cy="${ey}" r="3.6" fill="${dk}"/><circle cx="${60+s*ex+1}" cy="${ey-1.2}" r="1.1" fill="#fff"/>`).join('');
  if(mood==='sad') eyes+=[-1,1].map(s=>`<path d="M${60+s*ex-5} ${ey-7+(s<0?3:0)} L${60+s*ex+5} ${ey-7+(s<0?0:3)}" stroke="${dk}" stroke-width="2" stroke-linecap="round"/>`).join('');
 }
 const my=hy+hr*0.5;
 const mouth=mood==='sad'?`M54 ${my+3} q6 -5 12 0`:`M54 ${my} q3 4 6 0 q3 4 6 0`;
 const ears=`<path d="M${60-hr*0.95} ${hy-hr*0.1} L${60-hr*0.72} ${hy-hr*1.35} L${60-hr*0.15} ${hy-hr*0.85}Z" fill="${c.b}"/><path d="M${60+hr*0.95} ${hy-hr*0.1} L${60+hr*0.72} ${hy-hr*1.35} L${60+hr*0.15} ${hy-hr*0.85}Z" fill="${c.b}"/>`+
  `<path d="M${60-hr*0.78} ${hy-hr*0.35} L${60-hr*0.68} ${hy-hr*1.05} L${60-hr*0.33} ${hy-hr*0.75}Z" fill="#f7a5b0"/><path d="M${60+hr*0.78} ${hy-hr*0.35} L${60+hr*0.68} ${hy-hr*1.05} L${60+hr*0.33} ${hy-hr*0.75}Z" fill="#f7a5b0"/>`;
 const extra=k==='r'?`<path d="M${60-8} ${hy-hr*0.95} q3 6 0 10 M60 ${hy-hr*0.98} q0 7 0 11 M${60+8} ${hy-hr*0.95} q-3 6 0 10" stroke="#d9722a" stroke-width="2.4" fill="none" stroke-linecap="round"/>`:
  k==='p'?`<path d="M${60-hr} ${hy} q8 -4 14 -hr" fill="none"/>`:'';
 return `<svg viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <path d="M${60+c.bw*0.85} ${by+c.bh*0.4} q${c.bw*0.6} ${-c.bh*1.2} ${c.bw*0.1} ${-c.bh*1.5}" stroke="${c.b}" stroke-width="${k==='m'?5:7}" fill="none" stroke-linecap="round"/>
 <ellipse cx="60" cy="${by}" rx="${c.bw}" ry="${c.bh}" fill="${c.b}"/>
 <ellipse cx="60" cy="${by+c.bh*0.25}" rx="${c.bw*0.58}" ry="${c.bh*0.72}" fill="#fff"/>
 ${ears}
 <circle cx="60" cy="${hy}" r="${hr}" fill="${c.b}"/>
 ${extra}
 ${k!=='r'?`<ellipse cx="60" cy="${hy+hr*0.4}" rx="${hr*0.46}" ry="${hr*0.32}" fill="#fff"/>`:`<ellipse cx="60" cy="${hy+hr*0.4}" rx="${hr*0.44}" ry="${hr*0.3}" fill="#fff3e6"/>`}
 ${eyes}
 <path d="M${57} ${hy+hr*0.2} h6 l-3 3.6Z" fill="#f08aa0"/>
 <path d="${mouth}" stroke="${dk}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
 ${k!=='m'?'':`<circle cx="${60-hr*0.62}" cy="${hy+hr*0.3}" r="3.2" fill="#f7a5b0" opacity=".7"/><circle cx="${60+hr*0.62}" cy="${hy+hr*0.3}" r="3.2" fill="#f7a5b0" opacity=".7"/>`}
 </svg>`;
}

 const msg=S.xp===0?'Привет! Я Рыжик. Давай выучим первые слова вместе!':(n===-1?'Ты прошёл все уроки! Скоро будут новые.':'С возвращением! Продолжим урок «'+L[n].t+'»?');

 <div class="hero3 pop"><div class="bubble3"><b>Hello! 🐾</b>${S.xp===0?'Готов к первому уроку, друг?':'Рады видеть тебя снова!'}</div><div class="trio">${cat('r','happy')}${cat('p','happy')}${cat('m','happy')}</div></div>${cont}${homeExtra()}
 <h2>Уровень A1</h2>${units}<div class="node lock" style="margin-top:14px"><div class="ic">🔒</div><div><b>Уровень A2</b><small>Откроется после A1</small></div></div><div style="height:12px"></div>${nav('h')}`;
}

let G;
function start(i){
 if(hearts()<=0)return noHearts();
 const l=L[i],ex=[],ds=w=>sh([w[0],...sh(ALLW.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[0])]);
 l.w.forEach((w,k)=>{
  const rev=k%2===1,q=rev?w[1]:w[0],a=rev?w[0]:w[1];
  const pool=ALLW.map(x=>rev?x[0]:x[1]).filter(x=>x!==a);
  ex.push({t:'c',q,a,o:sh([a,...sh(pool).slice(0,3)]),rev});
  if(k%2===0){ex.push({t:'t',q:w[1],a:w[0]});ex.push({t:'l',a:w[0],o:ds(w)})}
  else ex.push({t:'a',a:w[0]});
 });
 l.s.forEach((s,k)=>ex.push({t:'b',q:s[0],a:s[1],lis:k%2===1?1:0}));
 ex.push({t:'m',p:sh(l.w).slice(0,5)});
 G={i,ex:sh(ex).sort((a,b)=>RK[a.t]-RK[b.t]),k:0,ok:0,sel:[],ik:0,miss:0,n0:ex.length,bad:new Set()};
 intro();
}
function step(){
 if(G.k>=G.ex.length)return G.prac?pracResult():result();
 if(!G.free&&hearts()<=0)return noHearts();
 const e=G.ex[G.k];
 G.cur=e;
 if(e.t==='t')return stepT(e);
 if(e.t==='m')return stepM(e);
 if(e.t==='l'||e.t==='a')return stepL(e);
 if(e.t==='b'&&!S.tut){S.tut=1;save();return tut()}
 const pr=Math.round(G.k/G.ex.length*100);
 let body;
 if(e.t==='c'){
  body=`<h3>${e.rev?'Как это по-английски?':'Выбери перевод'}</h3><div class="word">${e.q}</div><div class="opts">${e.o.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
 }else{
  const toks=e.a.split(' ');
  G.bank=sh(toks.map((t,i)=>({t,i})));G.sel=[];
  body=`<h3>${e.lis?'Послушай и собери предложение':'Собери предложение'}</h3>${e.lis?`<div style="text-align:center;margin:16px 0"><button class="say" style="font-size:20px;padding:14px 22px" onclick="say(G.cur.a)">🔊 Послушать</button></div>`:`<div class="word" style="font-size:24px">${e.q}</div>`}<div class="ans" id="ans"></div><div class="bank" id="bank"></div><button class="btn" id="chk" disabled>Проверить</button>`;
 }
 $('#app').innerHTML=`<div class="lh"><button class="x" onclick="home()" aria-label="Закрыть">✕</button><div class="bar"><i style="width:${pr}%"></i></div><div class="pill">❤️ ${hearts()}</div></div><div class="q pop" id="q">${body}</div><div id="fbx"></div>`;
 if(e.lis)say(e.a);
 if(e.t==='c')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickC(b,e));
 else{drawB();$('#chk').onclick=()=>checkB(e)}
}
function drawB(){
 $('#ans').innerHTML=G.sel.map(c=>`<button class="chip" onclick="unp(${c.i})">${c.t}</button>`).join('');
 $('#bank').innerHTML=G.bank.filter(c=>!G.sel.includes(c)).map(c=>`<button class="chip" onclick="pk(${c.i})">${c.t}</button>`).join('');
 $('#chk').disabled=G.sel.length===0;
}
function pk(i){G.sel.push(G.bank.find(c=>c.i===i));drawB()}
function unp(i){G.sel=G.sel.filter(c=>c.i!==i);drawB()}
function pickC(b,e){
 const ok=b.dataset.v===e.a;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===e.a)x.classList.add('ok')});
 if(!ok)b.classList.add('no');
 fb(ok,e.a);
}
function checkB(e){
 const ans=G.sel.map(c=>c.t).join(' ');
 document.querySelectorAll('.chip').forEach(x=>x.onclick=null);
 $('#chk').style.display='none';
 fb(ans===e.a,e.a);
}
const PR=['Отлично!','Супер!','Так держать!','Верно!','Молодец!'];
function fb(ok,a,msg){
 const en=wordOf(G.cur);
 if(ok){G.ok++;G.cb=(G.cb||0)+1;G.mc=Math.max(G.mc||0,G.cb);if(G.prac&&en&&S.weak[en]){S.weak[en]--;if(!S.weak[en])delete S.weak[en]}}
 else{G.miss++;G.cb=0;retry(G.cur);if(en)S.weak[en]=(S.weak[en]||0)+1;if(!G.free)loseHeart()}
 save();
 const who=ok?'r':'p';
 const txt=ok?PR[Math.floor(Math.random()*PR.length)]:(msg||'Не страшно, ошибки помогают учиться. Правильно: <b>'+a+'</b>. Повторим это в конце урока.');
 $('#fbx').innerHTML=`<div class="fb ${ok?'ok':'no'} pop"><div class="fbr">${cat(who,ok?'happy':'sad')}<p>${ok?'<b>'+txt+'</b>':txt}</p></div><button class="btn" style="margin-top:0" onclick="G.k++;step()">Дальше</button></div>`;
}
function result(){
 const l=L[G.i],cor=Math.max(0,G.n0-G.miss),bn=Math.floor((G.mc||0)/5)*5,xp=cor*10+(G.miss===0?10:0)+bn,lv0=Math.floor(S.xp/100);
 S.xp+=xp;S.done[l.id]=true;const up=Math.floor(S.xp/100)>lv0;
 const t=today(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}
 save();
 $('#app').innerHTML=`<div class="res pop">${cat('m','party')}<h1>${up?'Новый уровень!':'Урок пройден!'}</h1><div style="color:var(--muted)">«${l.t}»${bn?' · серия +'+bn+' ⭐':''}${up?' · 🏅 уровень '+(Math.floor(S.xp/100)+1):''}</div>
 <div class="stats"><div class="stat"><b>+${xp}</b><small>очков опыта</small></div><div class="stat"><b>${cor}/${G.n0}</b><small>верных ответов</small></div><div class="stat"><b>🔥 ${S.streak}</b><small>дней подряд</small></div></div>
 <button class="btn" onclick="home()">Продолжить</button></div>`;
}
function retry(e){
 if(!e||e.t==='m'||(e.n||0)>=2)return;
 let r;
 if(e.t==='b')r={t:'b',q:e.q,a:e.a,n:(e.n||0)+1};
 else{const en=wordOf(e),w=ALLW.find(x=>x[0]===en);r={t:'t',q:w[1],a:en,n:(e.n||0)+1}}
 G.ex.push(r);
}
function stepM(e){
 const pr=Math.round(G.k/G.ex.length*100);
 $('#app').innerHTML=`<div class="lh"><button class="x" onclick="home()" aria-label="Закрыть">✕</button><div class="bar"><i style="width:${pr}%"></i></div><div class="pill">❤️ ${hearts()}</div></div><div class="q pop"><h3>Соедини пары</h3><div style="color:var(--muted);font-size:14px">Нажми слово, затем его перевод</div><div class="mt"><div class="mc" id="mL"></div><div class="mc" id="mR"></div></div></div><div id="fbx"></div>`;
 const Ls=sh(e.p.map((w,i)=>({t:w[0],i,s:'e'}))),Rs=sh(e.p.map((w,i)=>({t:w[1],i,s:'r'})));
 let a=null,left=e.p.length,miss=0;
 const done=()=>{if(miss)G.bad.forEach(en=>{const w=ALLW.find(q=>q[0]===en);G.ex.push({t:'t',q:w[1],a:en,n:1});S.weak[en]=(S.weak[en]||0)+1});G.bad.clear();fb(miss===0,'',miss?'Были ошибки в парах. Эти слова повторим в конце урока.':null)};
 const tap=c=>{
  if(c.el.disabled)return;
  if(c.s==='e')say(c.t);
  if(!a||a.s===c.s){if(a)a.el.classList.remove('sel');a=c;c.el.classList.add('sel');return}
  const x=a,y=c;a=null;x.el.classList.remove('sel');
  if(x.i===y.i){[x,y].forEach(z=>{z.el.classList.add('ok');z.el.disabled=true});if(--left===0)setTimeout(done,400)}
  else{miss++;G.bad.add(e.p[x.i][0]);G.bad.add(e.p[y.i][0]);[x,y].forEach(z=>z.el.classList.add('no'));setTimeout(()=>[x,y].forEach(z=>z.el.classList.remove('no')),450)}
 };
 const mk=(c,sel)=>{const b=document.createElement('button');b.className='opt mb';b.textContent=c.t;b.onclick=()=>tap(c);c.el=b;$(sel).appendChild(b)};
 Ls.forEach(c=>mk(c,'#mL'));Rs.forEach(c=>mk(c,'#mR'));
}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

 if(L[G.i].note&&!G.nd){G.nd=1;return noteS()}
 const l=L[G.i],w=l.w[G.ik],d=EX[w[0]];
 S.coll[w[0]]=1;save();
 const last=G.ik===l.w.length-1;
 $('#app').innerHTML=`<div class="lh"><button class="x" onclick="home()" aria-label="Закрыть">✕</button><div class="bar"><i style="width:${G.ik/l.w.length*100}%"></i></div></div>
 <div class="q pop"><h3>Новое слово ${G.ik+1} из ${l.w.length}</h3>

 <button class="btn" onclick="G.ik++;${last?'exS()':'intro()'}">${last?'К упражнениям':'Дальше'}</button></div>`;
}
function stepT(e){
 const pr=Math.round(G.k/G.ex.length*100);
 $('#app').innerHTML=`<div class="lh"><button class="x" onclick="home()" aria-label="Закрыть">✕</button><div class="bar"><i style="width:${pr}%"></i></div><div class="pill">❤️ ${hearts()}</div></div><div class="q pop"><h3>${e.n?'Повторение: напиши слово ещё раз':'Напиши по-английски'}</h3><div class="word" style="margin-bottom:6px">${EX[e.a][0]}</div><div class="word" style="font-size:26px;margin-top:0">${e.q}</div><div style="text-align:center;margin-bottom:14px"><button class="say" onclick="say('${e.a}')">🔊 Послушать слово</button></div><input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введи слово"><button class="btn" id="chk" style="margin-top:16px">Проверить</button></div><div id="fbx"></div>`;
 const inp=$('#inp');inp.focus();
 const go=()=>{const ok=inp.value.trim().toLowerCase()===e.a.toLowerCase();inp.disabled=true;$('#chk').style.display='none';fb(ok,e.a,ok?null:'Не страшно! Пишется так: <b>'+e.a+'</b> ('+e.a.toUpperCase().split('').join('-')+'). Повторим это слово в конце урока.')};
 $('#chk').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()};
}

const learned=()=>ALLW.filter(w=>S.coll[w[0]]);
const nav=a=>`<div class='nav'>${[['h','🏠','Учиться','home'],['g','🎮','Игры','games'],['w','📚','Слова','words'],['t','🏆','Топ','board']].map(x=>`<button class='${a===x[0]?'on':''}' onclick='${x[3]}()'><span>${x[1]}</span>${x[2]}</button>`).join('')}</div>`;

function mkMatch(p,miss,done){
 let a=null,left=p.length;
 const tap=c=>{
  if(c.el.disabled)return;
  if(c.s==='e')say(c.t);
  if(!a||a.s===c.s){if(a)a.el.classList.remove('sel');a=c;c.el.classList.add('sel');return}
  const x=a,y=c;a=null;x.el.classList.remove('sel');
  if(x.i===y.i){[x,y].forEach(z=>{z.el.classList.add('ok');z.el.disabled=true});if(--left===0)setTimeout(done,300)}
  else{miss();[x,y].forEach(z=>z.el.classList.add('no'));setTimeout(()=>[x,y].forEach(z=>z.el.classList.remove('no')),450)}
 };
 const mk=(c,s)=>{const b=document.createElement('button');b.className='opt mb';b.textContent=c.t;b.onclick=()=>tap(c);c.el=b;$(s).appendChild(b)};
 sh(p.map((w,i)=>({t:w[0],i,s:'e'}))).forEach(c=>mk(c,'#mL'));
 sh(p.map((w,i)=>({t:w[1],i,s:'r'}))).forEach(c=>mk(c,'#mR'));
}

function pairsGame(){

 let miss=0;

}
function speed(){
 const pool=learned();let t=30,sc=0,cur,over=false;
 $('#app').innerHTML=`<div class='lh'><button class='x' onclick='games()'>✕</button><div class='bar'><i id='tb' style='width:100%;transition:width 1s linear;background:var(--good)'></i></div><div class='pill' id='sc'>0</div></div><div class='q'><h3>Переведи на английский</h3><div class='word' id='sw'></div><div class='opts' id='so'></div></div>`;
 const next=()=>{cur=pool[Math.floor(Math.random()*pool.length)];const o=sh([cur[0],...sh(ALLW.filter(x=>x[0]!==cur[0])).slice(0,4).map(x=>x[0])]);$('#sw').textContent=cur[1];$('#so').innerHTML=o.map(x=>`<button class='opt' data-v='${esc(x)}'>${x}</button>`).join('');document.querySelectorAll('#so .opt').forEach(b=>b.onclick=()=>{if(over)return;if(b.dataset.v===cur[0]){sc++;$('#sc').textContent=sc;next()}else{b.classList.add('no');b.disabled=true}})};
 next();
 const id=setInterval(()=>{if(!$('#tb')){clearInterval(id);return}t--;$('#tb').style.width=t/30*100+'%';if(t<=0){clearInterval(id);over=true;const nb=sc>(S.rec||0);if(nb)S.rec=sc;const xp=sc*2;S.xp+=xp;save();endScr('Время вышло!',[[sc,'слов'],[S.rec||0,'рекорд'],['+'+xp,'опыта']],nb&&sc>0?'Новый рекорд!':'','speed()')}},1000);
}
/* Облачное сохранение прогресса в Telegram CloudStorage */
const CS=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.CloudStorage)||null;
const CH=3500;
function cloudSave(){
 if(!CS)return;
 clearTimeout(cloudSave.t);
 cloudSave.t=setTimeout(()=>{try{
  const j=JSON.stringify(S),n=Math.ceil(j.length/CH);
  for(let i=0;i<n;i++)CS.setItem('eq'+i,j.slice(i*CH,(i+1)*CH),()=>{});
  CS.setItem('eqn',String(n),()=>{});
 }catch(e){}},800);
}
function cloudLoad(){
 if(!CS)return;
 try{CS.getItem('eqn',(e,n)=>{
  n=+n;
  if(e||!n){if(S.xp>0)cloudSave();return}
  const ks=[...Array(n).keys()].map(i=>'eq'+i);
  CS.getItems(ks,(e2,r)=>{try{
   if(e2)return;
   const c=JSON.parse(ks.map(k=>r[k]).join(''));
   if((c.t||0)>(S.t||0)){
    c.coll=c.coll||{};c.weak=c.weak||{};if(c.hp==null){c.hp=5;c.hpt=Date.now()}S=c;
    try{localStorage.setItem('eq',JSON.stringify(S))}catch(x){}
    if($('.path'))home();
   }else if((S.t||0)>(c.t||0))cloudSave();
  }catch(x){}});
 })}catch(e){}
}
const RK={c:0,l:1,m:2,t:3,a:4,b:5},HMAX=5,HREG=30*60000,LN=['Котёнок','Любопытный кот','Хвостатый ученик','Кот-полиглот','Профессор Мурр','Мастер слова','Гуру английского','Мудрый кот','Легенда','Король мурлыканья'];
function hearts(){
 if(S.hp>=HMAX){S.hpt=Date.now();return S.hp}
 const n=Math.floor((Date.now()-S.hpt)/HREG);
 if(n>0){S.hp=Math.min(HMAX,S.hp+n);S.hpt+=n*HREG;if(S.hp>=HMAX)S.hpt=Date.now()}
 return S.hp;
}
function loseHeart(){const h=hearts();if(h>=HMAX)S.hpt=Date.now();S.hp=Math.max(0,h-1)}
const nextHeart=()=>Math.max(1,Math.ceil((S.hpt+HREG-Date.now())/60000));
function wordOf(e){if(!e)return null;if(e.t==='c')return e.rev?e.a:e.q;if(e.t==='t'||e.t==='l'||e.t==='a')return e.a;return null}
function homeExtra(){
 const lv=Math.floor(S.xp/100)+1,p=S.xp%100,wk=Object.keys(S.weak).length;
 return `<div class='hero' style='padding:10px 14px;margin-top:-6px'><b style='white-space:nowrap'>🏅 Ур. ${lv} · ${LN[lv-1]||'Мастер'}</b><div class='bar' style='margin-left:10px'><i style='width:${p}%'></i></div></div>`+(wk>=3?`<button class='node cur' style='margin-bottom:16px' onclick='practice()'><div class='ic'>🎯</div><div><b>Повтори слабые слова</b><small>Ждут повторения: ${wk}</small></div></button>`:'');
}
function noHearts(){
 $('#app').innerHTML=`<div class='res pop'>${cat('p','sad')}<h1>Сердечки закончились</h1><div style='color:var(--muted);max-width:300px'>Следующее сердечко через ${nextHeart()} мин. Пока потренируй слабые слова: за тренировку вернётся одно сердечко.</div><div style='margin:16px 0;font-size:24px'>💔💔💔💔💔</div><button class='btn' onclick='practice()'>Тренировать слабые слова</button><button class='btn' style='margin-top:12px;background:var(--card);color:var(--muted);box-shadow:0 5px 0 var(--line)' disabled>📺 Восстановить за рекламу (скоро)</button><button class='btn' style='margin-top:12px;background:var(--card);color:var(--text);box-shadow:0 5px 0 var(--line)' onclick='home()'>На главную</button></div>`;
}
function tut(){
 $('#app').innerHTML=`<div class='lh'><button class='x' onclick='home()'>✕</button><div class='bar'><i style='width:0'></i></div></div><div class='q pop'><h3>Как собирать предложения</h3><div class='hero' style='align-items:flex-start'>${cat('p','think')}<div class='bubble' style='line-height:1.5'>Тебе покажут фразу по-русски, а английские слова будут перемешаны. Нужно выложить их в правильном порядке.</div></div><div class='card' style='text-align:left'><div style='color:var(--muted);font-size:14px'>Пример</div><div class='word' style='font-size:22px;margin:6px 0 10px;text-align:left'>Я студент</div><div class='ans' style='margin:6px 0'><span class='chip'>I</span><span class='chip'>am</span><span class='chip'>a</span><span class='chip'>student</span></div><div style='line-height:1.7;font-size:15px;margin-top:8px'><b>1.</b> Прочитай русскую фразу.<br><b>2.</b> Нажимай на слова внизу по очереди: они встанут в строку сверху.<br><b>3.</b> Ошибся? Нажми на слово в строке, и оно вернётся вниз.<br><b>4.</b> Когда порядок верный, нажми «Проверить».</div></div><button class='btn' onclick='step()'>Понятно, попробую!</button></div>`;
}
function exS(){
 const l=L[G.i];
 if(!l.s.length)return step();
 $('#app').innerHTML=`<div class='lh'><button class='x' onclick='home()'>✕</button><div class='bar'><i style='width:100%'></i></div></div><div class='q pop'><h3>Примеры предложений</h3><div class='hero' style='align-items:flex-start'>${cat('r','happy')}<div class='bubble'>Сначала посмотри, как выглядят готовые предложения. Дальше ты будешь собирать похожие.</div></div>${l.s.map(x=>`<div class='wr'><div><b>${x[1]}</b><small>${x[0]}</small></div><button class='x' data-t='${esc(x[1])}' onclick='say(this.dataset.t)'>🔊</button></div>`).join('')}<button class='btn' style='margin-top:16px' onclick='step()'>К упражнениям</button></div>`;
}
function stepL(e){
 const pr=Math.round(G.k/G.ex.length*100),ty=e.t==='a';
 $('#app').innerHTML=`<div class='lh'><button class='x' onclick='home()' aria-label='Закрыть'>✕</button><div class='bar'><i style='width:${pr}%'></i></div><div class='pill'>❤️ ${hearts()}</div></div><div class='q pop'><h3>${ty?'Послушай и напиши':'Послушай и выбери слово'}</h3><div style='text-align:center;margin:18px 0 22px'><button class='say' style='font-size:22px;padding:18px 28px' id='snd'>🔊 Слушать</button></div>${ty?`<input class='inp' id='inp' autocomplete='off' autocapitalize='off' spellcheck='false' placeholder='Что ты услышал?'><button class='btn' id='chk' style='margin-top:16px'>Проверить</button>`:`<div class='opts'>${e.o.map(o=>`<button class='opt' data-v='${esc(o)}'>${o}</button>`).join('')}</div>`}</div><div id='fbx'></div>`;
 $('#snd').onclick=()=>say(e.a);say(e.a);
 if(ty){const inp=$('#inp');inp.focus();const go=()=>{const ok=inp.value.trim().toLowerCase()===e.a.toLowerCase();inp.disabled=true;$('#chk').style.display='none';fb(ok,e.a,ok?null:'Это слово <b>'+e.a+'</b> ('+e.a.toUpperCase().split('').join('-')+'), по-русски «'+(ALLW.find(x=>x[0]===e.a)||[0,''])[1]+'». Повторим в конце урока.')};$('#chk').onclick=go;inp.onkeydown=ev=>{if(ev.key==='Enter')go()}}
 else document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickC(b,e));
}
function practice(){
 let ws=Object.keys(S.weak).sort((a,b)=>S.weak[b]-S.weak[a]).map(en=>ALLW.find(x=>x[0]===en)).filter(Boolean).slice(0,8);
 if(ws.length<4)ws=ws.concat(sh(learned().filter(w=>!ws.includes(w)))).slice(0,6);
 if(!ws.length){
  $('#app').innerHTML=`<div class='res pop'>${cat('p','happy')}<h1>Пока нечего повторять</h1><div style='color:var(--muted)'>Пройди хотя бы один урок.</div><button class='btn' style='margin-top:24px' onclick='home()'>К урокам</button></div>`;return;
 }
 const ex=[];
 ws.forEach((w,k)=>{
  const rev=k%2===1,a=rev?w[0]:w[1],pool=ALLW.map(x=>rev?x[0]:x[1]).filter(x=>x!==a);
  ex.push({t:'c',q:rev?w[1]:w[0],a,o:sh([a,...sh(pool).slice(0,3)]),rev});
  ex.push(k%2===0?{t:'t',q:w[1],a:w[0]}:{t:'l',a:w[0],o:sh([w[0],...sh(ALLW.filter(x=>x[0]!==w[0])).slice(0,3).map(x=>x[0])])});
 });
 G={prac:1,free:1,ex:sh(ex).sort((a,b)=>RK[a.t]-RK[b.t]),k:0,ok:0,sel:[],miss:0,n0:ex.length,bad:new Set()};
 step();
}
function pracResult(){
 const cor=Math.max(0,G.n0-G.miss),xp=cor*5;
 S.xp+=xp;S.hp=Math.min(HMAX,hearts()+1);if(S.hp>=HMAX)S.hpt=Date.now();save();
 const wk=Object.keys(S.weak).length;
 endScr('Тренировка готова!',[['+'+xp,'опыта'],[cor+'/'+G.n0,'верных'],['❤️ '+S.hp,'сердечек']],wk?'Слабых слов осталось: '+wk:'Слабых слов нет, отлично!','practice()');
}
home();
cloudLoad();
</script>
